<!doctype html>
<meta charset="utf-8">
<title>a V1.0 app window (WebRTC test)</title>
<body style="background:#123;color:#eee;font:14px system-ui">
<p>An Arcade V1.0 app window's room and media on its own arcade, with the WebRTC link its arcade makes (realtime.rtc).</p>
<script src="/t/media.js"></script>
<script>
"use strict";
// What appwindow.js does for a room joined with {fast: true}, cut down to what the test needs: the seat, its members,
// realtime.lanes (with its rtc states), and the signaling appwindow.js relays to its arcade (rtcOffer, rtcSignal,
// rtcLook): the arcade offers when this seat's id is the lower, answers a viewer's offer, and falls back to 'p'.
const q = new URLSearchParams(location.search);
const GAME = "piecestest", ROOM = "live-1", ME = q.get("me") || "guest-0000aaaa", RTC = "\u001farcade-rtc:";
const RTC_WAIT = 9000, RTC_FRESH = 8000;
const rpc = (method, params) => fetch("/t/rpc-b", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ method, params }) })
  .then((r) => r.json()).then((j) => { if (j.error) throw new Error(j.error.message); return j.result; });
// The window's pieces go to its arcade in JSON-RPC batches here: the real window reaches its arcade over a local
// socket, many calls a second, while this page goes through the test's proxy, a few dozen a second at most, and
// media.js sends one piece per call (sound alone is 50 a second). What it sends is unchanged.
const out = [];
let sending = false;
async function flush() {
  if (sending) return;
  sending = true;
  while (out.length) {
    const batch = out.splice(0, 64);
    try { await fetch("/t/rpc-b-batch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(batch) }); } catch (err) {}
  }
  sending = false;
}
const api = (cmd, a) => {
  if (cmd !== "realtime.media") return rpc(cmd, a);
  if (out.length < 400) out.push({ method: cmd, params: a });
  flush();
  return Promise.resolve({});
};
const s = { name: ROOM, token: "", me: null, members: {}, fast: { peers: {}, routes: {} }, media: null };
const log = { events: [], fast: [], signals: [], sent: [], errors: [], rtc: {}, fallback: [] };
window.addEventListener("error", (e) => log.errors.push(String(e.message)));
const M = ArcadeMedia({ api, push: (ev) => log.events.push({ type: ev.type, member: ev.member && ev.member.id, video: ev.video, audio: ev.audio, state: ev.state, on: ev.on }),
                        perms: async () => ({ media: true, pictures: true }) });
let k = 0;
function signal(to, body) {
  log.sent.push({ to, t: body.t });
  const text = JSON.stringify(body), key = (++k).toString(36), n = Math.ceil(text.length / 300);
  let p = Promise.resolve();
  for (let i = 0; i < n; i++) {
    const msg = { to, k: key, i, n, d: text.slice(i * 300, (i + 1) * 300) };
    p = p.then(() => rpc("realtime.send", { token: s.token, data: RTC + JSON.stringify(msg) }).catch(() => {})).then(() => new Promise((r) => setTimeout(r, 220)));
  }
  return p;
}
async function rtcAsk(peer, ask) {
  peer.rtc = { at: Date.now(), up: false };
  const mine = peer.rtc;
  let r;
  try { r = await rpc("realtime.rtc", { token: s.token, peer: peer.p.id, ...ask }); }
  catch (err) { log.errors.push("rtc: " + err.message); if (peer.rtc === mine) { peer.rtc = null; signal(peer.p.id, { t: "p" }); } return; }
  if (peer.rtc !== mine) return;
  if (r && r.signal) signal(peer.p.id, r.signal);
}
function rtcSignal(peer, o) {
  if (o.t === "p") { if (peer.rtc) { peer.rtc = null; rpc("realtime.rtc", { token: s.token, peer: peer.p.id, op: "close" }).catch(() => {}); } return; }
  if (o.t === "a") { if (peer.rtc) rpc("realtime.rtc", { token: s.token, peer: peer.p.id, op: "signal", signal: o }).catch((e) => log.errors.push("answer: " + e.message)); return; }
  if (o.t === "o") { if (o.v1) { signal(peer.p.id, { t: "p" }); return; } rtcAsk(peer, { op: "signal", signal: o }); return; }
  if (s.me.id >= peer.p.id) { signal(peer.p.id, { t: "p" }); return; }
  const fresh = peer.rtc && Date.now() - peer.rtc.at < RTC_FRESH && (!peer.hs || !o.s || peer.hs === o.s);
  if (o.s) peer.hs = o.s;
  if (!fresh && !(peer.rtc && peer.rtc.up && (!o.s || peer.hs === o.s))) rtcAsk(peer, { op: "offer" });
}
function meet(p) {
  if (p.id === s.me.id || s.fast.peers[p.id]) return;
  const peer = s.fast.peers[p.id] = { p, state: "connecting" };
  if (s.me.id < p.id) rtcAsk(peer, { op: "offer" });
}
async function poll() {
  for (;;) {
    let r; try { r = await rpc("realtime.poll", { token: s.token, wait: 2000 }); } catch (err) { continue; }
    for (const ev of r.events || []) {
      if (ev.type === "join" && ev.member) { s.members[ev.member.id] = ev.member; meet(ev.member); }
      else if (ev.type === "mchunk") M.heard(s, ev);
      else if (ev.type === "fast") log.fast.push({ from: ev.member.id, data: ev.data, b64: ev.b64 });
      else if (ev.type === "message" && typeof ev.data === "string" && ev.data.indexOf(RTC) === 0) {
        let m; try { m = JSON.parse(ev.data.slice(RTC.length)); } catch (err) { continue; }
        if (m.to !== s.me.id || typeof m.d !== "string") continue;
        const key = ev.member.id + "/" + m.k, got = (s.parts = s.parts || {})[key] || (s.parts[key] = []);
        got[m.i | 0] = m.d;
        let all = true; for (let i = 0; i < (m.n | 0); i++) if (got[i] == null) all = false;
        if (!all) continue;
        delete s.parts[key];
        let o; try { o = JSON.parse(got.join("")); } catch (err) { continue; }
        log.signals.push({ from: ev.member.id, t: o.t });
        if (!s.fast.peers[ev.member.id]) meet(ev.member);
        rtcSignal(s.fast.peers[ev.member.id], o);
      }
    }
  }
}
async function lanes() {
  for (;;) {
    try {
      const r = await rpc("realtime.lanes", { token: s.token });
      s.fast.routes = r.routes || {};
      log.rtc = r.rtc || {};
      const up = new Set(r.up || []);
      for (const id in s.fast.peers) {
        const peer = s.fast.peers[id];
        peer.state = up.has(id) ? "direct" : "connecting";
        if (!peer.rtc) continue;
        const st = log.rtc[id];
        if (st === "up") { peer.rtc.up = true; continue; }
        if (st === "failed" || (!peer.rtc.up && Date.now() - peer.rtc.at > RTC_WAIT)) {
          log.fallback.push({ id, st }); peer.rtc = null;
          rpc("realtime.rtc", { token: s.token, peer: id, op: "close" }).catch(() => {});
          signal(id, { t: "p" });
        }
      }
    } catch (err) {}
    await new Promise((r) => setTimeout(r, 1000));
  }
}
window.start = async function () {
  const j = await rpc("realtime.join", { page: GAME, game: GAME, room: ROOM, member: ME, fast: true });
  s.token = j.token; s.me = j.me;
  for (const p of j.members || []) { s.members[p.id] = p; meet(p); }
  poll(); lanes();
  return j.me;
};
window.goLive = async function () {
  const started = await M.door(s, { do: "start", video: true, audio: true });
  const shared = [];
  for (const id in s.fast.peers) {
    if (s.fast.peers[id].state !== "direct") continue;
    await M.door(s, { do: "share", peer: id, on: true });
    await M.door(s, { do: "hear", peer: id, on: true });
    await M.door(s, { do: "place", who: id, rect: { x: 10, y: 60, w: 320, h: 240 } });
    shared.push(id);
  }
  return { started, shared };
};
window.sendFast = async function (to, data) { return rpc("realtime.fast", { token: s.token, to: [to], data }); };
window.rtcStatus = () => rpc("realtime.rtc_status", {});
window.state = function () {
  const md = s.media, tiles = {};
  if (md) for (const key in md.tiles) {
    const el = md.tiles[key], w = el.width || el.videoWidth || 0;
    tiles[key] = { w, spread: w ? spread(el) : 0 };
  }
  const levels = {};
  if (md) for (const id in md.rx) levels[id] = md.rx[id].level.mic || 0;
  return { me: s.me, peers: Object.fromEntries(Object.entries(s.fast.peers).map(([id, p]) => [id, p.state])), tiles, levels, log };
};
function spread(el) {
  const c = document.createElement("canvas"); c.width = 32; c.height = 24;
  const g = c.getContext("2d"); g.drawImage(el, 0, 0, 32, 24);
  const d = g.getImageData(0, 0, 32, 24).data; let min = 255, max = 0;
  for (let i = 0; i < d.length; i += 4) { const v = (d[i] + d[i + 1] + d[i + 2]) / 3; min = Math.min(min, v); max = Math.max(max, v); }
  return Math.round(max - min);
}
</script>
